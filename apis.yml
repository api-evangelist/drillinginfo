name: Drillinginfo
description: >-
  Drillinginfo (now Enverus) is an Austin, Texas energy-technology company that
  provides AI-powered analytics and the most comprehensive dataset across oil and
  gas, power, renewables, and financial markets. Its Direct Access / Developer API
  (rebranded from Drillinginfo Direct Access to the Enverus Developer API) gives
  subscribers programmatic, read-only access to well, production, completion,
  permit, rig, wellbore, lease, and producing-entity datasets for import into data
  warehouses and internal applications. The API is token-authenticated (secret key
  in v3, client credentials plus API key in v2), returns JSON, and paginates via
  RFC 5988 Link headers. An official Python client (enverus-developer-api) handles
  authentication, token management, pagination, and retries. Enverus serves over
  8,000 companies across the energy value chain.
