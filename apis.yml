    url: https://app.enverus.com/direct/#/api/explorer/v3/gettingStarted
- name: Enverus Direct Access API (v2, legacy)
  description: >-
    Legacy Direct Access Version 2 of the Enverus / Drillinginfo API. Read-only
    JSON dataset access authenticated with client_id, client_secret and an API key
    exchanged for a bearer token. Superseded by the v3 Developer API.
  humanURL: https://app.enverus.com/direct/#/api/explorer/v2/gettingStarted
