apis:
- name: Enverus Developer API (v3)
  description: >-
    Current version of the Enverus Developer API (formerly Drillinginfo Direct
    Access). Read-only JSON access to energy datasets — wells, well-origins,
    wellbores, production, completions, permits, rigs, casings, legal-leases and
    producing-entities — authenticated with a secret key that is exchanged for a
    bearer token. Paginates via Link headers.
  humanURL: https://app.enverus.com/direct/#/api/explorer/v3/gettingStarted
  baseURL: https://api.enverus.com/v3/direct-access/
  tags:
